<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#f3f8f6"><title>LeafAtlas | Results dashboard</title><link rel="stylesheet" href="/assets/styles.css"></head>
<body><div class="app-shell"><header class="topbar"><div class="top-inner"><a class="logo" href="/"><img class="brand-logo-wide" src="/assets/leafatlas-official-logo.png" width="233" height="76" alt="LeafAtlas"></a><button id="contrast-button" class="contrast-button" type="button" aria-pressed="false">◐ High contrast</button></div></header><main class="wrapper"><div class="masthead"><div><div class="eyebrow">Staff area</div><h1 class="page-title">Results dashboard</h1><p class="page-lead">Restricted analysis of independent parent questionnaire groups.</p></div></div>
<section class="card lite-card auth-panel"><span class="section-label">Staff authentication</span><h2>Results access</h2><label class="field"><span style="display:block;font-weight:700;margin-bottom:7px">Staff access key</span><input id="staff-key" type="password" autocomplete="off" placeholder="Enter your staff key"></label><div class="button-row"><span></span><button class="btn" type="button" id="load-button">Load results</button></div><p class="mini-note">Staff access is required. Downloaded response files must be stored in approved Trust systems.</p><p id="status" class="status-text" role="status"></p></section>
<section id="dashboard" hidden><div class="dashboard-controls"><div class="dash-filters"><div class="dash-select"><label for="filter-topic" class="filter-label">Topic</label><select id="filter-topic" class="select"><option value="all">All five topics</option></select></div><div class="dash-group-select"><label for="filter-group" class="filter-label">Study group</label><select id="filter-group" class="select"><option value="both">Both groups</option><option value="baseline">Usual care</option><option value="leafatlas">LeafAtlas leaflet</option></select></div></div><div class="dash-actions"><button class="btn btn-secondary" id="refresh-button">Refresh</button><button class="btn" id="csv-button">Export summary CSV</button><button class="btn btn-secondary" id="raw-csv-button">Export responses CSV</button></div></div><div id="results"></div></section></main><footer class="footer"><div class="footer-line">LeafAtlas · Staff results · Access controlled</div></footer></div><script src="/assets/questions.js"></script><script src="/assets/dashboard.js"></script></body></html>
